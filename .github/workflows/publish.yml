# Publishes this site to GitHub Pages, by hand only: Actions → Publish → Run workflow, on main.
# Pushing never publishes it.
name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - id: build
        # Publish only the page and its assets, not the README or the workflow.
        run: |
          mkdir -p _site
          cp -R index.html favicon.svg apple-touch-icon.png mark.svg fonts img _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
